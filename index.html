<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>ISLANDS</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hurt"></div>
  <div id="fade"></div>

  <!-- Главное меню -->
  <div id="menu" class="overlay">
    <div class="panel">
      <h1>ISLANDS</h1>
      <p id="menu-sub"></p>
      <button id="btn-continue" class="big hidden"></button>
      <button id="btn-new" class="big primary"></button>
      <div class="lang">
        <button data-lang="ru">Русский</button>
        <button data-lang="en">English</button>
        <button data-lang="ka">ქართული</button>
      </div>
      <button id="btn-settings" class="big"></button>
      <button id="btn-cloud" class="big"></button>
    </div>
  </div>

  <!-- Аккаунт и облако -->
  <div id="cloud-panel" class="overlay hidden">
    <div class="panel wide">
      <h2 id="cl-title"></h2>
      <p id="cl-text"></p>
      <p id="cl-stores" class="cl-small"></p>
      <label id="cl-age-row" class="cl-check"><input type="checkbox" id="cl-age" /><span id="cl-age-l"></span></label>
      <p id="cl-msg" class="cl-small"></p>
      <button id="cl-signin" class="big primary"></button>
      <div id="cl-conflict" class="hidden">
        <b id="cl-c-title"></b>
        <p id="cl-c-text"></p>
        <button id="cl-use-cloud" class="big primary"></button>
        <button id="cl-use-local" class="big"></button>
      </div>
      <button id="cl-signout" class="big"></button>
      <button id="cl-delete" class="big danger"></button>
      <button id="cl-close" class="big"></button>
    </div>
  </div>

  <!-- Выбор героя -->
  <div id="hero-select" class="overlay hidden">
    <div class="panel wide">
      <h2 id="hs-title"></h2>
      <div id="hs-elements"></div>
      <div id="hs-list"></div>
      <div id="hs-info"></div>
      <button id="hs-go" class="big primary"></button>
      <button id="hs-back" class="big"></button>
    </div>
  </div>

  <!-- Настройки -->
  <div id="settings-panel" class="overlay hidden">
    <div class="panel wide">
      <h2 id="st-title"></h2>
      <div class="st-row"><span id="st-sound-l"></span><button id="st-sound"></button></div>
      <div class="st-row"><span id="st-vol-l"></span><input type="range" id="st-vol" min="0" max="100" /></div>
      <div class="st-row col"><span id="st-q-l"></span><div id="st-q"></div></div>
      <div class="st-row"><span id="st-fps-l"></span><button id="st-fps"></button></div>
      <button id="st-close" class="big"></button>
    </div>
  </div>
  <div id="fps" class="hidden"></div>

  <!-- Существа -->
  <div id="creatures-panel" class="overlay hidden">
    <div class="panel wide">
      <h2 id="cr-title"></h2>
      <div id="cr-list"></div>
      <div id="cr-cmds"></div>
      <button id="cr-close" class="big"></button>
    </div>
  </div>

  <!-- Амбар -->
  <div id="barn-panel" class="overlay hidden">
    <div class="panel wide">
      <h2 id="barn-title"></h2>
      <div id="barn-info"></div>
      <div id="barn-list"></div>
      <button id="barn-deposit" class="big primary"></button>
      <div id="barn-actions">
        <button id="barn-upgrade"></button>
        <button id="barn-repair"></button>
        <button id="barn-insure"></button>
        <button id="barn-bag"></button>
      </div>
      <button id="barn-close" class="big"></button>
    </div>
  </div>

  <!-- Гномы -->
  <div id="gnome-panel" class="overlay hidden">
    <div class="panel wide">
      <h2 id="gnome-title"></h2>
      <div id="gnome-info"></div>
      <div id="gnome-quest"></div>
      <div id="gnome-list"></div>
      <button id="gnome-close" class="big"></button>
    </div>
  </div>

  <!-- Торговец -->
  <div id="merchant-panel" class="overlay hidden">
    <div class="panel wide">
      <h2 id="merchant-title"></h2>
      <div id="merchant-info"></div>
      <div id="merchant-list"></div>
      <div class="mp-head" id="merchant-shop-h"></div>
      <div id="merchant-shop"></div>
      <div class="mp-head" id="merchant-sell-h"></div>
      <div id="merchant-sell"></div>
      <button id="merchant-close" class="big"></button>
    </div>
  </div>

  <!-- Заставка: кораблекрушение -->
  <div id="intro" class="hidden">
    <div id="intro-text"></div>
    <div id="intro-dots"></div>
    <button id="intro-next" class="big primary"></button>
  </div>

  <!-- Снаряжение -->
  <div id="items-panel" class="overlay hidden">
    <div class="panel wide">
      <h2 id="it-title"></h2>
      <div id="it-slots"></div>
      <div id="it-total" class="cl-small"></div>
      <div id="it-sets" class="cl-small"></div>
      <div id="it-bag-l" class="it-label"></div>
      <div id="it-bag"></div>
      <div id="it-detail" class="hidden">
        <b id="it-name"></b>
        <div id="it-bonus"></div>
        <div id="it-price" class="cl-small"></div>
        <div class="it-btns">
          <button id="it-act" class="big primary"></button>
          <button id="it-drop" class="big danger"></button>
        </div>
      </div>
      <p id="it-hint" class="cl-small"></p>
      <button id="it-book" class="big"></button>
      <button id="it-close" class="big"></button>
    </div>
  </div>

  <!-- Книга открытий -->
  <div id="book-panel" class="overlay hidden">
    <div class="panel wide">
      <h2 id="bk-title"></h2>
      <div id="bk-count" class="cl-small"></div>
      <div id="bk-list"></div>
      <button id="bk-close" class="big"></button>
    </div>
  </div>

  <!-- Поздравление с открытием -->
  <div id="discover" class="hidden">
    <div class="dc-box">
      <div class="dc-big">🎉</div>
      <div id="dc-t"></div>
      <div id="dc-n"></div>
      <div id="dc-d"></div>
    </div>
  </div>

  <!-- Итог матча на арене -->
  <div id="arena-result" class="overlay hidden">
    <div class="panel">
      <h2 id="ar-title"></h2>
      <div id="ar-stats"></div>
      <button id="ar-again" class="big primary"></button>
      <button id="ar-exit" class="big"></button>
    </div>
  </div>

  <!-- Строительство -->
  <div id="build-panel" class="overlay hidden">
    <div class="panel wide">
      <h2 id="bp-title"></h2>
      <div id="bp-list"></div>
      <button id="bp-close" class="big"></button>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div id="left">
      <div class="stats">
        <div class="row"><span class="label" id="hp-label"></span>
          <div class="bar hp"><div id="hp-fill"></div></div></div>
        <div class="row"><span class="label" id="lvl-label"></span>
          <div class="bar xp"><div id="xp-fill"></div></div></div>
      </div>
      <div id="res"></div>
      <div id="quest" class="hidden">
        <div class="quest-head"><b id="quest-title"></b><span id="quest-count"></span></div>
        <div id="quest-text"></div>
        <div class="bar xp"><div id="quest-fill"></div></div>
        <div id="quest-reward"></div>
        <div class="quest-guide"><button id="quest-where" title="Где это?">📍</button><span id="quest-dist"></span></div>
      </div>
      <div id="pet" class="hidden">
        <div class="pet-top"><span id="pet-name"></span><button id="btn-ability">⚡</button></div>
        <div class="bar cd"><div id="pet-cd"></div></div>
      </div>
    </div>

    <div id="boss" class="hidden"><div id="boss-name"></div><div class="bar hp"><div id="boss-fill"></div></div></div>
    <div id="arena-hud" class="hidden"><div id="arena-score"></div><div id="arena-info"></div></div>
    <canvas id="minimap" class="hidden" width="96" height="140"></canvas>
    <div id="arena-count" class="hidden"></div>
    <div id="toast"></div>
    <div id="hint"></div>
    <div id="prompt" class="hidden"></div>
    <button id="btn-menu" class="icon">☰</button>
    <button id="btn-creatures" class="icon second">🐾</button>
    <button id="btn-build" class="icon third">🔨</button>
    <button id="btn-items" class="icon fourth">🎒</button>

    <div id="tutorial" class="hidden">
      <div class="tut-head"><b id="tut-title"></b><span id="tut-count"></span>
        <button id="tut-skip"></button></div>
      <div id="tut-text"></div>
    </div>

    <div id="build-bar" class="hidden">
      <div id="bb-info"></div>
      <div class="bb-btns">
        <button id="bb-rot">↻</button>
        <button id="bb-ok">✔</button>
        <button id="bb-cancel">✖</button>
      </div>
    </div>

    <div id="actions">
      <!-- Команды зверю: всегда под рукой в бою (видны, когда рядом есть зверь) -->
      <div id="pet-cmds">
        <button id="pc-follow" data-cmd="follow">🐾</button>
        <button id="pc-stay" data-cmd="stay">✋</button>
        <button id="pc-defend" data-cmd="defend">🛡</button>
        <button id="pc-attack" data-cmd="attack">⚔</button>
      </div>
      <div id="spells">
        <button id="btn-spell3" class="round small spell"></button>
        <button id="btn-spell2" class="round small spell"></button>
        <button id="btn-spell1" class="round small spell"></button>
      </div>
      <button id="btn-interact" class="round small"></button>
      <button id="btn-attack" class="round"></button>
    </div>

    <!-- Сенсорное управление -->
    <div id="touch" class="hidden">
      <div id="stick"><div id="knob"></div></div>
      <button id="btn-jump" class="round"></button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
